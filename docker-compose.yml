services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: POSTGRES
      POSTGRES_DB: erp_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: erp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: erp_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_minio_password}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-erp-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-erp-app-secret-change-me}
      MINIO_PORTAL_ACCESS_KEY: ${MINIO_PORTAL_ACCESS_KEY:-erp-portal}
      MINIO_PORTAL_SECRET_KEY: ${MINIO_PORTAL_SECRET_KEY:-erp-portal-secret-change-me}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/cpe-beta &&
        mc mb --ignore-existing --with-lock local/cpe-produccion &&
        mc mb --ignore-existing local/bajas-beta &&
        mc mb --ignore-existing --with-lock local/bajas-produccion &&
        mc mb --ignore-existing local/temp-uploads &&
        mc version enable local/cpe-beta &&
        mc version enable local/cpe-produccion &&
        mc version enable local/bajas-beta &&
        mc version enable local/bajas-produccion &&
        mc retention set --default COMPLIANCE 6y local/cpe-produccion &&
        mc retention set --default COMPLIANCE 6y local/bajas-produccion &&
        mc ilm rule add --expire-days 1 local/temp-uploads || true &&
        printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::cpe-beta\",\"arn:aws:s3:::cpe-beta/*\",\"arn:aws:s3:::cpe-produccion\",\"arn:aws:s3:::cpe-produccion/*\",\"arn:aws:s3:::bajas-beta\",\"arn:aws:s3:::bajas-beta/*\",\"arn:aws:s3:::bajas-produccion\",\"arn:aws:s3:::bajas-produccion/*\",\"arn:aws:s3:::temp-uploads\",\"arn:aws:s3:::temp-uploads/*\"]}]}' > /tmp/erp-app-policy.json &&
        printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::cpe-beta/*\",\"arn:aws:s3:::cpe-produccion/*\"]}]}' > /tmp/erp-portal-policy.json &&
        mc admin policy create local erp-app-policy /tmp/erp-app-policy.json || true &&
        mc admin policy create local erp-portal-policy /tmp/erp-portal-policy.json || true &&
        mc admin user add local $$MINIO_APP_ACCESS_KEY $$MINIO_APP_SECRET_KEY || true &&
        mc admin user add local $$MINIO_PORTAL_ACCESS_KEY $$MINIO_PORTAL_SECRET_KEY || true &&
        mc admin policy attach local erp-app-policy --user $$MINIO_APP_ACCESS_KEY || true &&
        mc admin policy attach local erp-portal-policy --user $$MINIO_PORTAL_ACCESS_KEY || true
      "
    restart: "no"

  backup:
    image: postgres:16-alpine
    container_name: erp_backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: POSTGRES
      PGDATABASE: erp_db
      BACKUP_RETENTION_DAYS: "30"
    entrypoint: >
      sh -c "
        apk add --no-cache dcron &&
        echo '0 2 * * * pg_dump -Fc -f /backups/erp_$$(date +%Y%m%d_%H%M%S).dump && find /backups -name \"*.dump\" -mtime +$$BACKUP_RETENTION_DAYS -delete' | crontab - &&
        crond -f
      "
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backup_data:/backups

  # Doc 09 §9 — Backup diario de buckets MinIO de producción vía mc mirror.
  # Sólo se ejecuta si MINIO_BACKUP_ENABLED=true. Mantiene snapshots por
  # antigüedad y elimina los que pasen de MINIO_BACKUP_RETENTION_DAYS días.
  minio-backup:
    image: minio/mc:latest
    container_name: erp_minio_backup
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erp_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erp_minio_password}
      MINIO_BACKUP_RETENTION_DAYS: ${MINIO_BACKUP_RETENTION_DAYS:-30}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        while true; do
          STAMP=$$(date +%Y%m%d);
          echo \"[minio-backup] mirror $$STAMP iniciado\";
          mc mirror --overwrite local/cpe-produccion /backups/minio/cpe-produccion-$$STAMP || true;
          mc mirror --overwrite local/bajas-produccion /backups/minio/bajas-produccion-$$STAMP || true;
          find /backups/minio -maxdepth 1 -mindepth 1 -type d -mtime +$$MINIO_BACKUP_RETENTION_DAYS -exec rm -rf {} + 2>/dev/null || true;
          echo \"[minio-backup] mirror $$STAMP completado, durmiendo 24h\";
          sleep 86400;
        done
      "
    volumes:
      - backup_data:/backups

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backup_data:
